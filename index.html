<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BTS HR">
  <meta name="referrer" content="no-referrer">
  <title>BTS HR</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #0f2a43;
      --accent: #1f7a8c;
      --track: #dbe2e8;

      /* ความสูงของแถบ "สร้างโดยผู้ใช้ Google Apps Script" ที่จะถูกตัดทิ้ง
         ถ้ายังเห็นแถบเหลืออยู่ให้เพิ่มค่านี้ / ถ้าตัดเข้าไปในเนื้อหาแอปให้ลดค่านี้ */
      --gas-banner: 0px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;            /* ไม่มี scrollbar ที่หน้าเรา */
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    /* กรอบหลัก: เต็มจอ + กันรอยบาก/แถบระบบบนมือถือ */
    #app {
      position: fixed;
      inset: 0;
      height: 100vh;               /* fallback */
      height: 100dvh;              /* กัน address bar บนมือถือบัง */
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
      background: var(--bg);
    }

    /* กล่องตัดขอบ: ซ่อนแถบด้านบนที่ Google ใส่ใน iframe */
    #frame-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #gas-frame {
      display: block;
      width: 100%;
      height: calc(100% + var(--gas-banner));
      margin-top: calc(var(--gas-banner) * -1);
      border: 0;
      outline: 0;
      opacity: 0;
      transition: opacity .35s ease;
    }
    #gas-frame.ready { opacity: 1; }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand {
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1;
    }
    .brand span { color: var(--accent); }

    .bar {
      width: min(220px, 56vw);
      height: 3px;
      background: var(--track);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    .hint {
      margin: 0;
      font-size: 14px;
      color: #5b6b7a;
    }

    @media (prefers-reduced-motion: reduce) {
      #gas-frame, #loader { transition: none; }
      .bar i { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="brand">BTS <span>HR</span></div>
    <div class="bar"><i></i></div>
    <p class="hint">กำลังโหลด…</p>
  </div>

  <div id="app">
    <div id="frame-box">
      <iframe
        id="gas-frame"
        title="BTS HR"
        allow="fullscreen; geolocation; camera; microphone"
        allowfullscreen
        referrerpolicy="no-referrer"
        scrolling="no"
        frameborder="0"></iframe>
    </div>
  </div>

  <script>
    (function () {
      // URL จริงของ Apps Script (อยู่ใน JS ไม่แสดงบน address bar)
      var GAS_URL = "https://script.google.com/macros/s/AKfycbzSDD2rFOZoWAlVT_VbjAZm5ObLBUHtaRTGXSBpuMmF3zE5QFPn38y3raRHO_2ErKNr/exec";

      var frame  = document.getElementById("gas-frame");
      var loader = document.getElementById("loader");
      var done = false;

      function finish() {
        if (done) return;
        done = true;
        frame.classList.add("ready");
        loader.classList.add("hide");
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 700);
      }

      frame.addEventListener("load", function () {
        // หน่วงนิดเดียวให้ UI ของแอปเรนเดอร์ก่อนค่อย fade out
        setTimeout(finish, 250);
      });

      // กันค้าง: ถ้าโหลดนานผิดปกติ ให้เอา loader ออกเพื่อให้เห็นหน้าจริง/ข้อความ error
      setTimeout(finish, 20000);

      // ส่ง query string ของหน้าเรา (เช่น ?page=xxx) ต่อไปให้แอปด้วย
      var qs = window.location.search || "";
      frame.src = GAS_URL + qs;
    })();
  </script>
</body>
</html>
